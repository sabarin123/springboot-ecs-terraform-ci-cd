name: CI/CD - Terraform + Build + Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: simplewebsiteapp
  ECR_REPO: "simplewebsiteapp"  # repository name only

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./terraform-aws-prod
        run: terraform init -input=false

     # - name: Terraform Apply
     #   working-directory: ./terraform-aws-prod
     #   run: terraform apply -auto-approve

  build-and-deploy:
    name: Build, Push Image & Deploy to ECS
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: aws_account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID is $ACCOUNT_ID"

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Debug image URI
        run: |
          echo "IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"

      - name: Build Docker image
        run: |
          docker build -t "${ECR_REPO}:${IMAGE_TAG}" .
          docker tag "${ECR_REPO}:${IMAGE_TAG}" "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"

      - name: Push Docker image to ECR
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPO}" --region "${AWS_REGION}" || \
          aws ecr create-repository --repository-name "${ECR_REPO}" --region "${AWS_REGION}"
          docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"

      - name: Register new ECS task definition with updated image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLUSTER: "${{ env.PROJECT_NAME }}-cluster"
          TASK_FAMILY: "${{ env.PROJECT_NAME }}-task"
          CONTAINER_NAME: "app"
          IMAGE_URI: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
        run: |
          # remove any line breaks in IMAGE_URI
          IMAGE_URI_CLEAN=$(echo "$IMAGE_URI" | tr -d '\n')
          # fetch current task definition JSON
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY)
          # build new task definition JSON with updated image
          NEW_DEF=$(echo "$TASK_DEF_JSON" \
            | jq --arg IMG "$IMAGE_URI_CLEAN" \
                '.taskDefinition
                 | { family: .family,
                     networkMode: .networkMode,
                     containerDefinitions: (.containerDefinitions | map(.image = $IMG)),
                     requiresCompatibilities: .requiresCompatibilities,
                     cpu: .cpu,
                     memory: .memory,
                     executionRoleArn: .executionRoleArn,
                     taskRoleArn: .taskRoleArn }')
          echo "$NEW_DEF" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json

      - name: Force new ECS deployment
        env:
          CLUSTER: "${{ env.PROJECT_NAME }}-cluster"
          SERVICE: "${{ env.PROJECT_NAME }}-service"
        run: |
          aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment
