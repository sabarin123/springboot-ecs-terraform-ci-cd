name: CI/CD - Terraform + Build + Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: simplewebsiteapp
  ECR_REPO: "simplewebsiteapp"   # <-- just the repo name

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./terraform-aws-prod
        run: terraform init -input=false

  build-and-deploy:
    name: Build, Push Image & Deploy to ECS
    runs-on: ubuntu-latest
    needs: terraform
    env:
      AWS_REGION: ${{ env.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}   # <- make sure this secret exists
      ECR_REPO: ${{ env.ECR_REPO }}
      PROJECT_NAME: ${{ env.PROJECT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          # BUILD and tag locally with repo:tag
          docker build -t "${ECR_REPO}:${IMAGE_TAG}" .
          # FULL image URI
          FULL_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
          # Tag for ECR push
          docker tag "${ECR_REPO}:${IMAGE_TAG}" "$FULL_IMAGE"
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

      - name: Push Docker image to ECR
        run: |
          # create repo if missing
          aws ecr describe-repositories --repository-names "${ECR_REPO}" --region "${AWS_REGION}" || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --region "${AWS_REGION}"
          docker push "${FULL_IMAGE}"

      - name: Register new task definition with updated image
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          CLUSTER: "${PROJECT_NAME}-cluster"
          TASK_FAMILY: "${PROJECT_NAME}-task"
          CONTAINER_NAME: "app"
          IMAGE_URI: "${{ env.FULL_IMAGE }}"   # <-- full URI with registry
        run: |
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY)
          NEW_DEF=$(echo "$TASK_DEF_JSON" \
            | jq --arg IMG "$IMAGE_URI" \
                '.taskDefinition
                 | { family: .family,
                     networkMode: .networkMode,
                     containerDefinitions: (.containerDefinitions | map( .image = $IMG )),
                     requiresCompatibilities: .requiresCompatibilities,
                     cpu: .cpu,
                     memory: .memory,
                     executionRoleArn: .executionRoleArn,
                     taskRoleArn: .taskRoleArn }')
          echo "$NEW_DEF" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json

      - name: Force new deployment (update service)
        env:
          CLUSTER: "${PROJECT_NAME}-cluster"
          SERVICE: "${PROJECT_NAME}-service"
        run: |
          aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment
