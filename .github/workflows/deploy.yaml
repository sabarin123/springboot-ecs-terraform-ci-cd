name: CI/CD - Terraform + Build + Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: simplewebsiteapp
  ECR_REPO: simplewebsiteapp

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./terraform-aws-prod
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ./terraform-aws-prod
        run: terraform apply -auto-approve

  build-and-deploy:
    name: Build, Push Image & Deploy to ECS
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: vars
        run: |
          echo "IMAGE_TAG_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_TAG_VERSION=v1" >> $GITHUB_ENV

      - name: Build Docker image and push to ECR
        run: |
          echo "Using AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }} REGION=${{ secrets.AWS_REGION }}"
          FULL_IMAGE_SHA="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${IMAGE_TAG_SHA}"
          FULL_IMAGE_VERSION="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${IMAGE_TAG_VERSION}"
          
          # Build image
          docker build -t "${{ env.ECR_REPO }}:${IMAGE_TAG_SHA}" .
          docker tag "${{ env.ECR_REPO }}:${IMAGE_TAG_SHA}" "${FULL_IMAGE_SHA}"
          docker tag "${{ env.ECR_REPO }}:${IMAGE_TAG_SHA}" "${FULL_IMAGE_VERSION}"

          # Push both tags
          docker push "${FULL_IMAGE_SHA}"
          docker push "${FULL_IMAGE_VERSION}"

          echo "FULL_IMAGE=${FULL_IMAGE_VERSION}" >> $GITHUB_ENV

      - name: Register new ECS task definition with updated image
        env:
          CLUSTER: "${{ env.PROJECT_NAME }}-cluster"
          TASK_FAMILY: "${{ env.PROJECT_NAME }}-task"
          CONTAINER_NAME: "app"
          IMAGE_URI: ${{ env.FULL_IMAGE }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Registering ECS task with image: $IMAGE_URI"
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY)
          NEW_DEF=$(echo "$TASK_DEF_JSON" \
            | jq --arg IMG "$IMAGE_URI" \
                '.taskDefinition
                 | { family: .family,
                     networkMode: .networkMode,
                     containerDefinitions: (.containerDefinitions | map( .image = $IMG )),
                     requiresCompatibilities: .requiresCompatibilities,
                     cpu: .cpu,
                     memory: .memory,
                     executionRoleArn: .executionRoleArn,
                     taskRoleArn: .taskRoleArn }')
          echo "$NEW_DEF" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json --region "${AWS_REGION}"

      - name: Force new ECS deployment
        env:
          CLUSTER: "${{ env.PROJECT_NAME }}-cluster"
          SERVICE: "${{ env.PROJECT_NAME }}-service"
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment --region "${AWS_REGION}"
