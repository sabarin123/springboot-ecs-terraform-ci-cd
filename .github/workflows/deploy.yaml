name: CI/CD - Terraform + Build + Deploy to ECS

on:
  push:
    branches:
      - main

# top-level sane defaults (can be overridden by secrets)
env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: simplewebsiteapp
  ECR_REPO: simplewebsiteapp

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    env:
      # do NOT try to reference env inside an expression here.
      # Prefer secrets if provided, otherwise fall back to the top-level default literal
      AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-north-1' }}

      - name: Terraform Init
        working-directory: ./terraform-aws-prod
        run: terraform init -input=false

  build-and-deploy:
    name: Build, Push Image & Deploy to ECS
    runs-on: ubuntu-latest
    needs: terraform
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || '' }}
      ECR_REPO: ${{ secrets.ECR_REPO || env.ECR_REPO }}    # safe: this expression uses top-level literal env.ECR_REPO
      PROJECT_NAME: ${{ secrets.PROJECT_NAME || env.PROJECT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-north-1' }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: set_tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image, tag for ECR and export FULL_IMAGE
        run: |
          # Use job env vars available at runtime
          echo "Using AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID AWS_REGION=$AWS_REGION ECR_REPO=$ECR_REPO"
          docker build -t "${ECR_REPO}:${IMAGE_TAG}" .
          FULL_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
          docker tag "${ECR_REPO}:${IMAGE_TAG}" "${FULL_IMAGE}"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> $GITHUB_ENV

      - name: Push Docker image to ECR
        run: |
          echo "Pushing $FULL_IMAGE"
          aws ecr describe-repositories --repository-names "${ECR_REPO}" --region "${AWS_REGION}" || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --region "${AWS_REGION}"
          docker push "${FULL_IMAGE}"

      - name: Register new task definition with updated image
        # DON'T try to set IMAGE_URI via ${{ }} — FULL_IMAGE is runtime env available in shell
        env:
          CLUSTER: "${{ env.PROJECT_NAME }}-cluster"   # this is read at parse time (top-level env)
          TASK_FAMILY: "${{ env.PROJECT_NAME }}-task"
          CONTAINER_NAME: app
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
        run: |
          IMAGE_URI="${FULL_IMAGE}"   # use the runtime env var written into $GITHUB_ENV earlier
          echo "Registering task def with image: $IMAGE_URI"
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY --region "${AWS_REGION}")
          NEW_DEF=$(echo "$TASK_DEF_JSON" \
            | jq --arg IMG "$IMAGE_URI" \
                '.taskDefinition
                 | { family: .family,
                     networkMode: .networkMode,
                     containerDefinitions: (.containerDefinitions | map( .image = $IMG )),
                     requiresCompatibilities: .requiresCompatibilities,
                     cpu: .cpu,
                     memory: .memory,
                     executionRoleArn: .executionRoleArn,
                     taskRoleArn: .taskRoleArn }')
          echo "$NEW_DEF" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json --region "${AWS_REGION}"

      - name: Force new deployment (update service)
        env:
          CLUSTER: "${{ env.PROJECT_NAME }}-cluster"
          SERVICE: "${{ env.PROJECT_NAME }}-service"
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
        run: |
          aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment --region "${AWS_REGION}"
